name: pipeline2
 
on:
  push:
    branches:
      - main 
      
jobs:
  
   extract-job:
     runs-on: ubuntu-latest
     steps:
     - name: checkout code
       uses: actions/checkout@v4

     - name: Run extract.py
       run: python extract.py 

   transfer-job:
        runs-on: ubuntu-latest
        needs: extract-job 
        steps:
          - name: checkout code
            uses: actions/checkout@v2

          - name: Run transfer.py
            run: python transfer.py 

   load-job:
           runs-on: ubuntu-latest
           needs: transfer-job
           steps:
           - name: checkout code
             uses: actions/checkout@v2

           - name: Run load.py
             run: python load.py 